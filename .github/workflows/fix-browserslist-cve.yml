name: Fix Browserslist CVE

on:
  push:
    branches:
      - fix/browserslist-cve-2026-73088

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update Browserslist lock entry
        run: npm update browserslist --package-lock-only

      - name: Verify patched version
        run: |
          node -e "const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/browserslist']?.version; console.log('browserslist', v); if (!v || v.localeCompare('4.28.7', undefined, {numeric:true}) < 0) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/fix-browserslist-cve.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/fix-browserslist-cve.yml
          git diff --cached --quiet && exit 1
          git commit -m "Fix Browserslist security vulnerability"
          git push
