name: Security dependency refresh

on:
  push:
    branches:
      - security/dependency-fixes-2026-08

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-fixes-2026-08

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade vulnerable direct dependencies
        run: |
          npm install react-router-dom@^7.18.0
          npm install --save-dev vite@^7.3.2 vitest@^3.2.6 postcss@^8.5.24
          npm audit fix || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Report remaining audit findings
        run: npm audit || true

      - name: Commit verified dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore: remediate dependency vulnerabilities"
            git push origin HEAD:security/dependency-fixes-2026-08
          fi
