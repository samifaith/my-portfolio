<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#a2003b" />
		<meta name="description" content="Sam's Portfolio" />

		<!-- Preconnect to external domains for faster loading -->
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="dns-prefetch" href="https://use.typekit.net" />

		<!-- Preload critical LCP image -->
		<link
			rel="preload"
			as="image"
			href="%PUBLIC_URL%/illustratedheadshot.webp"
			fetchpriority="high"
		/>

		<!-- Favicon and icons -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

		<!-- Font loading with display swap to prevent FOIT -->
		<link
			rel="stylesheet"
			href="https://use.typekit.net/sep4pur.css"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript
			><link rel="stylesheet" href="https://use.typekit.net/sep4pur.css"
		/></noscript>

		<link rel="manifest" href="/site.webmanifest" />
		<title>Sam on Canvas: Portfolio</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>
</html>
